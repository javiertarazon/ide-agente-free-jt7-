name: quality-gate

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install node deps
        run: npm ci
      - name: Install python deps
        run: pip install pytest
      - name: Lint JS syntax gate
        run: npm run test:control-panel-script-syntax-smoke
      - name: Quality gate (smokes + unit x3 + build)
        run: python tools/quality/run_quality_gate.py --flake-runs 3 --json
